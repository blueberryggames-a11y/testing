<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pika.solutions</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Montserrat', sans-serif;
      background: #fff;
      color: #000;
    }

    /* ── HERO (nav sits inside this) ── */
    .hero {
      position: relative;
      width: 100%;
      height: 170px;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* ── NAV overlaid on hero ── */
    nav {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      background: transparent;
      z-index: 10;
    }

    nav .hamburger {
      font-size: 22px;
      cursor: pointer;
      color: #fff;
      line-height: 1;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }

    nav img.logo {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    nav span.site-name {
      font-size: 18px;
      font-weight: 500;
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    }

    /* ── TITLE SECTION ── */
    .title-section {
      text-align: center;
      padding: 52px 20px 40px;
      border-bottom: 1px solid #ddd;
      background: #fff;
    }

    .title-section h1 {
      font-size: clamp(52px, 8vw, 92px);
      font-weight: 900;
      letter-spacing: -2px;
      color: #000;
    }

    /* ── DESCRIPTION ── */
    .description {
      text-align: center;
      padding: 38px 20px 44px;
      max-width: 820px;
      margin: 0 auto;
      font-size: 16.5px;
      line-height: 1.65;
      color: #111;
      background: #fff;
    }

    /* ── GALLERY SECTION ── */
    .gallery-section {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    /* blurred bg */
    .gallery-bg {
      position: absolute;
      inset: 0;
      background-image: url('rimuru.png');
      background-size: cover;
      background-position: center 30%;
      filter: brightness(0.35) blur(3px);
      transform: scale(1.06);
    }

    .gallery-cards {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 16px;
      padding: 36px 24px 56px;
    }

    .gallery-cards .card {
      flex: 1;
      max-width: 400px;
      border-radius: 3px;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0,0,0,0.6);
    }

    .gallery-cards .card img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    /* ── LINK ICON ── */
    .link-bar {
      position: relative;
      z-index: 2;
      display: flex;
      justify-content: center;
      padding: 0 0 32px;
    }

    .link-icon {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      border: 1.5px solid rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
    }

    .link-icon:hover { background: rgba(255,255,255,0.3); }

    .link-icon svg {
      width: 22px;
      height: 22px;
      fill: #fff;
    }

    @media (max-width: 700px) {
      .gallery-cards { flex-direction: column; align-items: center; }
      .gallery-cards .card { max-width: 100%; width: 100%; }
    }
  </style>
</head>
<body>

  <!-- HERO with nav overlaid -->
  <div class="hero">
    <img src="rimuru.png" alt="Rimuru hero" />
    <nav>
      <span class="hamburger">&#9776;</span>
      <img class="logo" src="pika.png" alt="Pikachu logo" />
      <span class="site-name">pika.solutions</span>
    </nav>
  </div>

  <!-- TITLE -->
  <div class="title-section">
    <h1>pika.solutions</h1>
  </div>

  <!-- DESCRIPTION -->
  <p class="description">
    Welcome to pika.solutions this webpage is currently a place holder! Thanks for visiting this website. The website currently does not have a use,&nbsp; but may have one in the future.
  </p>

  <!-- GALLERY -->
  <div class="gallery-section">
    <div class="gallery-bg"></div>
    <div class="gallery-cards">
      <div class="card"><img src="rimuru.png" alt="Rimuru 1" /></div>
      <div class="card"><img src="rimuru.png" alt="Rimuru 2" /></div>
      <div class="card"><img src="rimuru.png" alt="Rimuru 3" /></div>
    </div>
    <div class="link-bar">
      <div class="link-icon" title="Link">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7C4.24 7 2 9.24 2 12s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/>
        </svg>
      </div>
    </div>
  </div>

</body>
</html>
