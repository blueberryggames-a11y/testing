<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pika.solutions</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;900&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Montserrat', sans-serif;
      color: #000;
    }

    /* ── HERO ── */
    .hero {
      position: relative;
      width: 100%;
      height: 175px;
      overflow: hidden;
    }

    /* actual image */
    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 35%;
      display: block;
      filter: brightness(0.5) blur(3px);
      transform: scale(1.05);
    }



    nav {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 20px;
      background: transparent;
      z-index: 2;
    }

    nav .hamburger { font-size: 22px; cursor: pointer; color: #fff; line-height: 1; }
    nav img.logo { width: 44px; height: 44px; object-fit: contain; }
    nav span.site-name { font-size: 18px; font-weight: 500; color: #fff; }

    /* ── TITLE ── */
    .title-section {
      text-align: center;
      padding: 52px 20px 40px;
      border-bottom: 1px solid rgba(0,0,0,0.12);
      background: rgba(255,255,255,0.88);
    }

    .title-section h1 {
      font-size: clamp(56px, 8vw, 96px);
      font-weight: 900;
      letter-spacing: -2px;
      color: #000;
    }

    /* ── DESCRIPTION ── */
    .description-wrap { background: rgba(255,255,255,0.88); }
    .description {
      text-align: center;
      padding: 42px 20px 48px;
      max-width: 780px;
      margin: 0 auto;
      font-size: 16px;
      line-height: 1.7;
      color: #111;
    }

    /* ── GALLERY ── */
    .gallery-section {
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    /* blurred bg behind cards */
    .gallery-bg {
      position: absolute;
      inset: 0;
      background-image: url('rimuru.png');
      background-size: cover;
      background-position: center;
      filter: brightness(0.28) blur(8px);
      transform: scale(1.08);
      z-index: 0;
    }

    .gallery-cards {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      gap: 14px;
      padding: 32px 40px 40px;
    }

    .gallery-cards .card {
      flex: 1;
      min-width: 0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .gallery-cards .card img { width: 100%; display: block; object-fit: cover; }

    .link-bar {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      padding: 8px 0 28px;
    }

    .link-icon {
      width: 46px; height: 46px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.35);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: background 0.2s;
    }
    .link-icon:hover { background: rgba(255,255,255,0.28); }
    .link-icon svg { width: 22px; height: 22px; fill: #fff; }

    @media (max-width: 700px) {
      .gallery-cards { flex-direction: column; padding: 24px 16px 36px; }
    }
  </style>
</head>
<body>

  <!-- HERO with image + dark tint -->
  <div class="hero">
    <img src="rimuru.png" alt="Rimuru hero" />
    <nav>
      <span class="hamburger">&#9776;</span>
      <img class="logo" src="pika.png" alt="Pikachu" />
      <span class="site-name">pika.solutions</span>
    </nav>
  </div>

  <!-- TITLE -->
  <div class="title-section">
    <h1>pika.solutions</h1>
  </div>

  <!-- DESCRIPTION -->
  <div class="description-wrap">
    <p class="description">
      Welcome to pika.solutions this webpage is currently a place holder! Thanks for visiting this website. The website currently does not have a use,&nbsp; but may have one in the future.
    </p>
  </div>

  <!-- GALLERY -->
  <div class="gallery-section">
    <div class="gallery-bg"></div>
    <div class="gallery-cards">
      <div class="card"><img src="rimuru.png" alt="Rimuru 1" /></div>
      <div class="card"><img src="rimuru.png" alt="Rimuru 2" /></div>
      <div class="card"><img src="rimuru.png" alt="Rimuru 3" /></div>
    </div>
    <div class="link-bar">
      <div class="link-icon" title="Link">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7C4.24 7 2 9.24 2 12s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/>
        </svg>
      </div>
    </div>
  </div>

</body>
</html>
